# Database dan message broker sementara untuk pengujian: tanpa volume persisten dan tanpa data demo.
services:
  platform:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: platform_test
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: target_test
    ports: ["127.0.0.1:15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres2:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: target_test_2
    ports: ["127.0.0.1:15434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target_test_2"]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:15672:5672"
      - "127.0.0.1:25672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.0
    volumes:
      - ./scripts/mysql-test-init.sql:/docker-entrypoint-initdb.d/01-scoped-user.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: test-password
      MYSQL_DATABASE: target_test
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptest-password"]
      interval: 2s
      timeout: 2s
      retries: 45
