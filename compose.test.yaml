# Disposable databases: no application volumes, no demo data.
services:
  platform:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: platform_test
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: target_test
    ports: ["127.0.0.1:15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  mysql:
    image: mysql:8.0
    volumes:
      - ./scripts/mysql-test-init.sql:/docker-entrypoint-initdb.d/01-scoped-user.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: test-password
      MYSQL_DATABASE: target_test
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptest-password"]
      interval: 2s
      timeout: 2s
      retries: 45
