services:
  platform-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform_db}
    ports:
      - "${PLATFORM_DB_PORT:-5432}:5432"
    volumes:
      - platform_data:/var/lib/postgresql/data
      - ./migrations/platform:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_DB_USER:-postgres} -d ${PLATFORM_DB_NAME:-platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  target-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TARGET_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${TARGET_PG_PASSWORD:-postgres}
      POSTGRES_DB: ${TARGET_PG_NAME:-target_db}
    ports:
      - "${TARGET_PG_PORT:-5433}:5432"
    volumes:
      - target_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_PG_USER:-postgres} -d ${TARGET_PG_NAME:-target_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  target-postgres-2:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TARGET_PG2_USER:-postgres}
      POSTGRES_PASSWORD: ${TARGET_PG2_PASSWORD:-postgres}
      POSTGRES_DB: ${TARGET_PG2_NAME:-target_db_2}
    ports:
      - "${TARGET_PG2_PORT:-5434}:5432"
    volumes:
      - target_pg2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_PG2_USER:-postgres} -d ${TARGET_PG2_NAME:-target_db_2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  target-mysql:
    image: mysql:8.0
    restart: unless-stopped
    profiles: ["legacy-mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${TARGET_MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${TARGET_MYSQL_NAME:-target_db}
    ports:
      - "${TARGET_MYSQL_PORT:-3306}:3306"
    volumes:
      - target_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${TARGET_MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment: &app-env
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a private 32-byte ENCRYPTION_KEY in .env}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      PLATFORM_DB_HOST: platform-db
      PLATFORM_DB_PORT: 5432
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-postgres}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-postgres}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-platform_db}
      PLATFORM_DB_SSLMODE: disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-db-platform-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SPA_DIST_DIR: /app/frontend/dist
      TARGET_PG_HOST: target-postgres
      TARGET_PG_PORT: 5432
      TARGET_PG_USER: ${TARGET_PG_USER:-postgres}
      TARGET_PG_PASSWORD: ${TARGET_PG_PASSWORD:-postgres}
      TARGET_PG_NAME: ${TARGET_PG_NAME:-target_db}
      TARGET_PG2_HOST: target-postgres-2
      TARGET_PG2_PORT: 5432
      TARGET_PG2_USER: ${TARGET_PG2_USER:-postgres}
      TARGET_PG2_PASSWORD: ${TARGET_PG2_PASSWORD:-postgres}
      TARGET_PG2_NAME: ${TARGET_PG2_NAME:-target_db_2}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      platform-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: db-platform-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      backend-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  platform_data:
  target_pg_data:
  target_pg2_data:
  target_mysql_data:
  rabbitmq_data:
