receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  fluentforward:
    endpoint: 0.0.0.0:24224
processors:
  transform/docker:
    log_statements:
      - set(resource.attributes["service.name"], log.attributes["fluent.tag"])
  batch: {}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    logs/docker:
      receivers: [fluentforward]
      processors: [transform/docker, batch]
      exporters: [otlphttp/loki]
    logs/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
